# Weekly (and on demand): create every combination at today's newest package versions, check that the official docs
# the templates follow haven't changed, and that every community skill the kit installs still exists upstream. A failure opens (or comments on) one issue, so templates get fixed
# before people run into the problem.
name: Canary

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: canary
  cancel-in-progress: true

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: latest
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: git config --global user.name canary && git config --global user.email canary@example.com
      - id: build
        continue-on-error: true
        run: bun run verify:build 2>&1 | tee build.log
      - id: docs
        continue-on-error: true
        run: bun run verify:docs 2>&1 | tee docs.log
      - id: skills
        continue-on-error: true
        run: bun run verify:skills 2>&1 | tee skills.log
      - if: steps.build.outcome == 'failure' || steps.docs.outcome == 'failure' || steps.skills.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Canary: templates need attention"
          body="$(printf 'Run: %s/%s/actions/runs/%s\n\n### verify:build\n```\n%s\n```\n### verify:docs\n```\n%s\n```\n### verify:skills\n```\n%s\n```\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$(tail -40 build.log)" "$(tail -40 docs.log)" "$(tail -30 skills.log)")"
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number')"
          if [ -n "$number" ]; then gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"; else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"; fi
          exit 1
