# Publishes to npm when a GitHub Release is published (tag vX.Y.Z), with npm trusted publishing: no npm token is
# stored anywhere, and npm attaches a provenance statement linking the version to this run.
# One-time setup, the release steps and troubleshooting: RELEASING.md.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: npm # must match the environment in the npm trusted publisher settings
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release tag, version and repository agree
        run: |
          node -e '
            const pkg = require("./package.json");
            const fail = (message) => { console.log(`::error::${message}`); process.exit(1); };
            const tag = process.env.GITHUB_REF_NAME;
            const repo = `https://github.com/${process.env.GITHUB_REPOSITORY}`;
            if (tag !== `v${pkg.version}`) fail(`The release tag ${tag} does not match package.json version ${pkg.version}.`);
            if (pkg.private) fail("package.json still has \"private\": true.");
            const url = (pkg.repository?.url ?? "").replace(/^git\+/, "").replace(/\.git$/, "");
            if (url !== repo) fail(`package.json repository.url is ${url}; npm trusted publishing needs ${repo}.`);
          '
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: latest
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@12 # trusted publishing needs npm 11.5.1 or later
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run verify:package
      - run: git config --global user.name release && git config --global user.email release@example.com
      - run: bun run verify:build --quick
      - name: Publish (pre-releases such as 0.3.0-beta.1 go to the "next" tag)
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$(npm view "create-agent-ready-app@$version" version 2>/dev/null)" = "$version" ]; then
            echo "::notice::create-agent-ready-app@$version is already on npm: nothing to publish."
            exit 0
          fi
          case "$version" in
            *-*) npm publish --tag next ;;
            *) npm publish ;;
          esac
