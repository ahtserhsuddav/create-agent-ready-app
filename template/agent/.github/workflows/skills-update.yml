# Weekly (and on demand): refresh the community agent skills in .agents/skills/ from their makers' repositories, and
# open a pull request when anything changed. Review it like code: agents follow these instructions.
# Needs Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests". Pull requests a
# workflow opens don't start CI by themselves: close and reopen it, or push to the branch, to run the checks.
name: Agent skills update

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npx -y skills@latest update -p -y
        env:
          DISABLE_TELEMETRY: "1"
      - name: Open a pull request when skills changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- .agents/skills skills-lock.json)" ]; then echo "Agent skills are current."; exit 0; fi
          branch="agent-skills/$(date +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add .agents/skills skills-lock.json
          git commit -m "Update agent skills from their makers"
          git push -u origin "$branch"
          gh pr create --title "Update agent skills" --body "Weekly refresh of the community skills in \`.agents/skills/\` (\`skills update\`). Read the diff before merging: agents follow these instructions."
